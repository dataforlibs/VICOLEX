<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifepaths — Archival Ukrainica in Canada</title>
<style>
  :root{
    --bg:#0b1420; --panel:#0f1c2e; --panel2:#132339; --ink:#eaf2fb; --muted:#8ba3c0;
    --accent:#ffb454; --accent2:#5ec8ff; --line:#2a3f5a; --land:#2d4a6b; --land-stroke:#5a7699;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;overflow:hidden}
  #app{position:relative;width:100vw;height:100vh}
  svg{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 40%, #0e1b2c 0%, #070d16 100%)}
  .land{fill:var(--land);stroke:var(--land-stroke);stroke-width:0.7}
  .graticule{fill:none;stroke:#1a2a3f;stroke-width:0.4}

  #topbar{position:absolute;top:0;left:0;right:0;padding:14px 18px 10px;
    background:linear-gradient(to bottom, rgba(7,13,22,0.92), rgba(7,13,22,0));
    pointer-events:none; z-index:5}
  #topbar h1{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:.2px;color:var(--ink)}
  #topbar .sub{font-size:11.5px;color:var(--muted)}

  #controls{position:absolute;left:18px;right:18px;bottom:18px;z-index:6;
    background:rgba(15,28,46,0.88);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:14px;padding:12px 16px 10px;
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row + .row{margin-top:8px}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);color:#231400;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4;cursor:default}
  #yearLabel{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--accent);min-width:56px}
  #yearSlider{flex:1;min-width:140px;accent-color:var(--accent)}
  select,input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12.5px}
  input[type=text]{width:190px}
  label.small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  #speed{width:70px}
  #stats{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

  .path-line{fill:none;stroke:var(--accent2);stroke-width:1.1;opacity:.55;
    stroke-linejoin:round;stroke-linecap:round}
  .path-line.dim{opacity:.06}
  .path-line.hi{stroke:var(--accent);stroke-width:2.2;opacity:1}
  .wp-dot{fill:var(--accent2);stroke:#04101c;stroke-width:.6}
  .wp-dot.dim{opacity:.1}
  .wp-dot.hi{fill:var(--accent)}
  .head-dot{fill:#fff;stroke:var(--accent);stroke-width:1.4}

  #tooltip{position:absolute;pointer-events:none;z-index:20;
    background:rgba(10,18,30,.96);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:12px;max-width:260px;display:none;line-height:1.45}
  #tooltip b{color:var(--accent)}
  #tooltip .place{color:var(--accent2)}

  #search-panel{position:absolute;top:56px;right:18px;z-index:6;width:270px;
    background:rgba(15,28,46,0.92);border:1px solid var(--line);border-radius:12px;
    padding:10px;max-height:60vh;display:flex;flex-direction:column;gap:8px}
  #search-panel input{width:100%}
  #results{overflow-y:auto;flex:1;font-size:12px}
  .res-item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
  .res-item:hover{background:var(--panel2)}
  .res-item .yrs{color:var(--muted);font-size:11px;white-space:nowrap}
  #legend{position:absolute;left:18px;top:56px;z-index:6;font-size:11px;color:var(--muted);
    background:rgba(15,28,46,0.8);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    display:flex;flex-direction:column;gap:4px}
  #legend .lg{display:flex;align-items:center;gap:6px}
  #legend .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
  #detail{position:absolute;left:18px;top:56px;z-index:7;width:290px;
    background:rgba(15,28,46,0.95);border:1px solid var(--accent);border-radius:12px;
    padding:12px 14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #detail h3{margin:0 0 2px;font-size:14px;color:var(--accent)}
  #detail .meta{font-size:11px;color:var(--muted);margin-bottom:8px}
  #detail .route{font-size:12px;line-height:1.7;max-height:32vh;overflow-y:auto}
  #detail .route .step{padding:2px 0}
  #detail .route .step.cur{color:var(--accent);font-weight:700}
  #detail .route .yr{color:var(--muted);font-variant-numeric:tabular-nums}
  #detail .route .dur{color:var(--accent2);font-size:11px}
  #detail button.close{position:absolute;top:8px;right:8px;padding:2px 7px;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <svg id="map"></svg>

  <div id="topbar">
    <h1>Lifepaths of fond creators — Archival Ukrainica in Canada</h1>
    <div class="sub">Approximate migration paths reconstructed from 324 archival biographies · watch the diaspora spread across the map, decade by decade</div>
  </div>

  <div id="legend">
    <div class="lg"><span class="sw" style="background:var(--accent2)"></span> path travelled so far</div>
    <div class="lg"><span class="sw" style="background:#fff;border:1.4px solid var(--accent)"></span> current position</div>
    <div class="lg"><span class="sw" style="background:var(--accent)"></span> selected person</div>
    <div class="lg"><span class="sw" style="background:var(--accent2);width:14px;height:14px"></span> bigger dot = longer stay there</div>
  </div>

  <div id="search-panel">
    <input id="search" type="text" placeholder="Search a person, place, or institution…">
    <div id="results"></div>
  </div>

  <div id="detail">
    <button class="close" id="detailClose">✕</button>
    <h3 id="detailName"></h3>
    <div class="meta" id="detailMeta"></div>
    <div class="route" id="detailRoute"></div>
  </div>

  <div id="tooltip"></div>

  <div id="controls">
    <div class="row">
      <button id="playBtn" class="primary">▶ Play</button>
      <button id="resetBtn">⟲ Reset</button>
      <span id="yearLabel">—</span>
      <input id="yearSlider" type="range" min="1850" max="2015" value="1850" step="1">
      <label class="small">Speed <input id="speed" type="range" min="1" max="12" value="4"></label>
      <div id="stats">—</div>
    </div>
  </div>
</div>

:1959,"k":true,"pr":"r","la":52.94,"lo":-106.451}]},{"id":638,"n":"Сімпсон Джордж Вілфред","by":1893,"dy":1969,"prov":"Saskatchewan","inst":"Saskatchewan Archives Board — Saskatoon office","fond":"СІМПСОН ДЖОРДЖ ВІЛФРЕД (SIMPSON GEORGE WILFRED).","w":[{"t":"b","p":"Ontario","r":"Онтаріо","y":1893,"k":true,"pr":"r","la":51.254,"lo":-85.323},{"t":"l","p":"Toronto, ON","r":"Торонтському","y":1931.0,"k":false,"pr":"c","la":43.653,"lo":-79.383},{"t":"d","p":"Saskatoon, SK","r":"Саскатун","y":1969,"k":true,"pr":"c","la":52.133,"lo":-106.67}]},{"id":643,"n":"Проць Дон","by":1944,"dy":null,"prov":"Saskatchewan","inst":"University of Saskatchewan Archives","fond":"ПРОЦЬ ДОН (DON PROCH FONDS).","w":[{"t":"b","p":"Manitoba","r":"Манітоба","y":1944,"k":true,"pr":"r","la":53.761,"lo":-98.814},{"t":"l","p":"Montreal, QC","r":"Монреалі","y":1944,"k":false,"pr":"c","la":45.502,"lo":-73.567}]},{"id":646,"n":"Буйняк Віктор","by":1925,"dy":null,"prov":"Saskatchewan","inst":"University of Saskatchewan Archives","fond":"БУЙНЯК ВІКТОР (V. О. BUYNIAK FONDS).","w":[{"t":"b","p":"Warsaw, Poland","r":"Варшава","y":1925,"k":true,"pr":"c","la":52.23,"lo":21.012}]},{"id":649,"n":"Стриєк Дмитро","by":1899,"dy":1991,"prov":"Saskatchewan","inst":"University of Saskatchewan Archives","fond":"СТРИЄК ДМИТРО (DMYTRO STRYJEK FONDS).","w":[{"t":"b","p":"Ternopil Oblast, Ukraine","r":"Тернопільської обл","y":1899,"k":true,"pr":"r","la":49.553,"lo":25.595},{"t":"l","p":"Hafford, SK","r":"Хаффорді","y":1926,"k":true,"pr":"c","la":52.744,"lo":-107.377},{"t":"l","p":"Canada","r":"Канадській","y":1958.5,"k":false,"pr":"n","la":61.067,"lo":-107.992},{"t":"d","p":"Saskatoon, SK","r":"Саскатун","y":1991,"k":true,"pr":"c","la":52.133,"lo":-106.67}]}];

const width = () => document.getElementById('app').clientWidth;
const height = () => document.getElementById('app').clientHeight;

const svg = d3.select('#map');
const gMap = svg.append('g').attr('class','map-layer');
const gGrat = svg.append('g');
const gPaths = svg.append('g').attr('class','paths-layer');
const gDots = svg.append('g').attr('class','dots-layer');
const gHead = svg.append('g').attr('class','heads-layer');

const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);

function fitProjection(){
  projection.fitSize([width(), height()*0.86], WORLD);
  // nudge down slightly to make room for topbar
  const t = projection.translate();
  projection.translate([t[0], t[1] + height()*0.05]);
}
fitProjection();

gMap.selectAll('path.land')
  .data(WORLD.features)
  .join('path')
  .attr('class','land')
  .attr('d', path);

const graticule = d3.geoGraticule().step([20,20]);
gGrat.append('path').attr('class','graticule').attr('d', path(graticule()));

// ---------- precompute screen coordinates for each waypoint ----------
// IMPORTANT: waypoint's time value lives in `w.y` (year) — never reuse that
// key for the projected pixel position, or every time comparison silently
// breaks. Screen coords live in `w.sx` / `w.sy` instead.
PEOPLE.forEach(p=>{
  p.w.forEach((w,i)=>{
    const c = projection([w.lo, w.la]); w.sx = c ? c[0] : null; w.sy = c ? c[1] : null;
    // dwell time at this place = years until the *next* waypoint (open-ended
    // for the last one, so it doesn't get penalized for "only" 0 duration)
    const nxt = p.w[i+1];
    w.dur = nxt ? Math.max(0, nxt.y - w.y) : null;
  });
});
const durRadius = d3.scaleSqrt().domain([0,40]).range([1.3,7]).clamp(true);

const YEAR_MIN = 1850, YEAR_MAX = 2015;
let currentYear = YEAR_MIN;
let playing = false;
let timer = null;
let selectedId = null;

const yearSlider = document.getElementById('yearSlider');
const yearLabel = document.getElementById('yearLabel');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const speedInput = document.getElementById('speed');
const statsEl = document.getElementById('stats');
const tooltip = document.getElementById('tooltip');

// screen-space position of a person's path at a given year, by linear
// interpolation between the two surrounding (already time-sorted) waypoints
function screenPosAtYear(wps, year){
  if(year <= wps[0].y) return [wps[0].sx, wps[0].sy];
  const last = wps[wps.length-1];
  if(year >= last.y) return [last.sx, last.sy];
  for(let i=0;i<wps.length-1;i++){
    const a=wps[i], b=wps[i+1];
    if(year>=a.y && year<=b.y && a.sx!=null && b.sx!=null){
      const t = b.y===a.y ? 1 : (year-a.y)/(b.y-a.y);
      return [a.sx+(b.sx-a.sx)*t, a.sy+(b.sy-a.sy)*t];
    }
  }
  return [last.sx, last.sy];
}

const lineGen = d3.line().x(d=>d.sx).y(d=>d.sy).curve(d3.curveCatmullRom.alpha(0.6));

// build one path element + one head dot per person (up front), update visibility each frame
const pathSel = gPaths.selectAll('path.path-line')
  .data(PEOPLE, d=>d.id)
  .join('path')
  .attr('class','path-line')
  .attr('data-id', d=>d.id)
  .on('mousemove', (ev,d)=> showTooltip(ev,d))
  .on('mouseleave', hideTooltip)
  .on('click', (ev,d)=> selectPerson(d.id));

const headSel = gHead.selectAll('circle.head-dot')
  .data(PEOPLE.filter(d=>d.w.length>=1), d=>d.id)
  .join('circle')
  .attr('class','head-dot')
  .attr('r', 2.1)
  .style('display','none');

function render(){
  const y = currentYear;
  let activeCount = 0, doneCount = 0;
  pathSel.each(function(d){
    const wps = d.w.filter(w=>w.sx!=null);
    if(wps.length<2){ d3.select(this).attr('d', null); return; }
    const visible = wps.filter(w=>w.y<=y);
    let segPts = visible.slice();
    // include the interpolated current position as the path tip if between waypoints
    if(visible.length>0 && visible.length<wps.length){
      const [ix,iy] = screenPosAtYear(wps, y);
      segPts = segPts.concat([{sx:ix,sy:iy}]);
      activeCount++;
    } else if(visible.length===wps.length){
      doneCount++;
    }
    d3.select(this).attr('d', segPts.length>=2 ? lineGen(segPts) : null);
  });

  headSel.each(function(d){
    const wps = d.w.filter(w=>w.sx!=null);
    if(!wps.length) return;
    const sel = d3.select(this);
    if(y < wps[0].y - 0.001){ sel.style('display','none'); return; }
    const [ix,iy] = screenPosAtYear(wps, y);
    sel.style('display', y>wps[wps.length-1].y ? 'none' : null)
       .attr('cx', ix).attr('cy', iy);
  });

  gDots.selectAll('circle.wp-dot')
    .data(PEOPLE.flatMap(d=>d.w.filter(w=>w.sx!=null && w.y<=y).map(w=>({...w, pid:d.id}))))
    .join('circle')
    .attr('class','wp-dot')
    .attr('r', d=> durRadius(d.dur==null ? 2 : d.dur))
    .attr('cx', d=>d.sx).attr('cy', d=>d.sy);

  applyHighlight();
  yearSlider.value = Math.round(y);
  yearLabel.textContent = Math.round(y);
  statsEl.textContent = `${activeCount} journeys in progress · ${doneCount} completed · ${PEOPLE.length} total`;
}

function applyHighlight(){
  pathSel.classed('dim', d=> selectedId!=null && d.id!==selectedId)
         .classed('hi', d=> selectedId!=null && d.id===selectedId);
  gDots.selectAll('circle.wp-dot')
    .classed('dim', d=> selectedId!=null && d.pid!==selectedId)
    .classed('hi', d=> selectedId!=null && d.pid===selectedId);
}

function showTooltip(ev,d){
  const wps = d.w.filter(w=>w.sx!=null && w.y<=currentYear);
  if(!wps.length) return;
  const last = wps[wps.length-1];
  tooltip.style.display='block';
  tooltip.style.left = (ev.clientX+14)+'px';
  tooltip.style.top = (ev.clientY+10)+'px';
  const durTxt = last.dur ? ` · stayed ~${Math.round(last.dur)} yr${Math.round(last.dur)===1?'':'s'}` : '';
  tooltip.innerHTML = `<b>${d.n}</b><br>${d.by||'?'}–${d.dy||'?'}<br>
    <span class="place">${last.p}</span>${last.k? '' : ' <i>(estimated)</i>'} · ${Math.round(last.y)}${durTxt}`;
}
function hideTooltip(){ tooltip.style.display='none'; }

function selectPerson(id){
  selectedId = (selectedId===id) ? null : id;
  applyHighlight();
  if(selectedId!=null){
    const d = PEOPLE.find(p=>p.id===selectedId);
    showDetail(d);
  } else {
    document.getElementById('detail').style.display='none';
  }
}

function showDetail(d){
  const det = document.getElementById('detail');
  det.style.display='block';
  document.getElementById('detailName').textContent = d.n;
  document.getElementById('detailMeta').textContent =
    `${d.by||'?'}–${d.dy||'?'} · ${d.prov} · ${d.inst}`;
  const routeEl = document.getElementById('detailRoute');
  routeEl.innerHTML = d.w.map(w=>{
    const cur = w.y<=currentYear;
    const durTxt = w.dur ? ` <span class="dur">(~${Math.round(w.dur)} yr${Math.round(w.dur)===1?'':'s'})</span>` : '';
    return `<div class="step ${cur?'cur':''}"><span class="yr">${Math.round(w.y)}${w.k?'':'~'}</span> ${w.p}${w.k?'':' <i>(est.)</i>'}${durTxt}</div>`;
  }).join('');
}

document.getElementById('detailClose').onclick = ()=>{ selectedId=null; applyHighlight(); document.getElementById('detail').style.display='none'; };

// ---------- controls ----------
function step(){
  const speed = +speedInput.value;
  currentYear += speed * 0.25;
  if(currentYear >= YEAR_MAX){ currentYear = YEAR_MAX; pause(); }
  render();
}
function play(){
  if(playing) return;
  playing = true;
  playBtn.textContent = '⏸ Pause';
  timer = setInterval(step, 60);
}
function pause(){
  playing = false;
  playBtn.textContent = '▶ Play';
  if(timer) clearInterval(timer);
}
playBtn.onclick = ()=> playing ? pause() : play();
resetBtn.onclick = ()=>{ pause(); currentYear = YEAR_MIN; selectedId=null; applyHighlight(); document.getElementById('detail').style.display='none'; render(); };
yearSlider.oninput = (e)=>{ pause(); currentYear = +e.target.value; render(); };

// ---------- search ----------
const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('results');
function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ resultsEl.innerHTML=''; return; }
  const hits = PEOPLE.filter(d=>
    d.n.toLowerCase().includes(q) ||
    d.inst.toLowerCase().includes(q) ||
    d.prov.toLowerCase().includes(q) ||
    d.w.some(w=>w.p.toLowerCase().includes(q))
  ).slice(0,40);
  resultsEl.innerHTML = hits.map(d=>
    `<div class="res-item" data-id="${d.id}"><span>${d.n}</span><span class="yrs">${d.by||'?'}–${d.dy||'?'}</span></div>`
  ).join('') || '<div style="color:var(--muted);padding:6px">No matches</div>';
  resultsEl.querySelectorAll('.res-item').forEach(el=>{
    el.onclick = ()=>{
      const id = +el.dataset.id;
      const d = PEOPLE.find(p=>p.id===id);
      // jump the timeline to this person's birth year so their path is visible
      if(d.w[0] && d.w[0].y!=null){ currentYear = Math.max(currentYear, d.w[0].y); }
      selectedId = id;
      render();
      showDetail(d);
    };
  });
}
searchInput.oninput = (e)=>runSearch(e.target.value);

window.addEventListener('resize', ()=>{
  fitProjection();
  gMap.selectAll('path.land').attr('d', path);
  gGrat.select('path').attr('d', path(graticule()));
  PEOPLE.forEach(p=> p.w.forEach(w=>{ const c=projection([w.lo,w.la]); w.sx=c?c[0]:null; w.sy=c?c[1]:null; }));
  render();
});

render();
</script>
</body>
